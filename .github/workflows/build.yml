name: Build

# Every push and pull request: run the tests and check the plugin compiles. Releases come from release.yml.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet run --project tests/EmbyTheme.Tests -c Release

      - name: Build
        run: dotnet build src/EmbyTheme/EmbyTheme.csproj -c Release -o out
